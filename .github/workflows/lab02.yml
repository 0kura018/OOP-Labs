name: Lab 2 checks

on:
  pull_request:
    paths:
      - 'labs/Lab02.DisplayShop/**'
      - 'tests/Lab02.DisplayShop.Tests/**'
      - '.github/workflows/lab02.yml'
      - 'output/lab02/*.docx'
  push:
    branches: [lab-comp-aggr-track-1]
    paths:
      - 'labs/Lab02.DisplayShop/**'
      - 'tests/Lab02.DisplayShop.Tests/**'
      - '.github/workflows/lab02.yml'
      - 'output/lab02/*.docx'

permissions:
  contents: read

jobs:
  test-and-demonstrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run Lab 2 tests
        run: dotnet test tests/Lab02.DisplayShop.Tests/Lab02.DisplayShop.Tests.csproj --verbosity normal
      - name: Run all command files at three thresholds
        shell: bash
        run: |
          for file in shop-monday shop-tuesday shop-edge-cases; do
            for level in TRACE INFO ERROR; do
              dotnet run --project labs/Lab02.DisplayShop --no-build -- "labs/Lab02.DisplayShop/commands/$file.txt" "$level"
            done
          done
      - name: Run constructor and formatter demonstrations
        run: dotnet run --project labs/Lab02.DisplayShop --no-build -- --demo TRACE
      - name: Run migrated parentheses validator
        run: dotnet run --project labs/Lab02.DisplayShop --no-build -- --parentheses "()" ")((()))" "(" "(())((()())())"
      - name: Render the report for visual review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-liberation
          mkdir -p /tmp/lab02-report-review
          libreoffice -env:UserInstallation=file:///tmp/lab02-lo --headless --convert-to pdf --outdir /tmp/lab02-report-review output/lab02/Lab02_Report_EN.docx
          pdftoppm -scale-to 1600 -png /tmp/lab02-report-review/Lab02_Report_EN.pdf /tmp/lab02-report-review/page
      - uses: actions/upload-artifact@v4
        with:
          name: lab02-report-review
          path: /tmp/lab02-report-review/
